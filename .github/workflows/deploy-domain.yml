name: Reusable domain portal deployment

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.repository }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out domain source
        uses: actions/checkout@v6
      - name: Check out QED-AI public platform
        uses: actions/checkout@v6
        with:
          repository: qed-artifacts/qed-public-platform
          path: .qed-platform
      - name: Build and validate portal
        run: node .qed-platform/bin/build-domain.mjs --source . --out dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

